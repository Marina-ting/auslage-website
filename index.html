<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<meta name="theme-color" content="#2F5D50">

<!-- COMING-SOON-MODUS: an src/content/site.js → `comingSoon` gekoppelt, aber
     NICHT automatisch synchron — index.html wird statisch ausgeliefert und
     kann den JS-Wert nicht lesen. Titel/Description/og:-Tags unten sind
     bewusst neutral gehalten und robots ist auf noindex gesetzt, weil
     Crawler und Link-Vorschauen (WhatsApp, Slack etc.) kein JS ausführen und
     sonst trotz Platzhalterseite die vollen Marketingtexte/Preise sehen
     würden. Beim Live-Schalten (comingSoon auf false) HIER GLEICHZEITIG:
     robots-Zeile entfernen, Titel/Description/og:-Tags wieder auf die
     Werte unten in den Kommentaren setzen. -->
<meta name="robots" content="noindex,nofollow">
<title>Bald online – auslage</title>
<meta name="description" content="auslage ist bald online.">

<!-- Sobald auslage.io registriert und live ist: <link rel="canonical"> und og:url ergänzen. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="auslage">
<!-- Live-Werte (beim Live-Schalten diesen Block einkommentieren und die drei
     Coming-Soon-Zeilen darüber/darunter entfernen, siehe Hinweis oben).
     Stand 18.08.2026: Wortlaut von Susi, Zeichenzahlen von ihr gezählt
     (Title 52, Description 151). Die frühere Fassung trug "Bezirk Baden" —
     Marina hat Baden am 15.08. aus dem Zuschnitt genommen — und war mit
     62 Zeichen zu lang für die Ergebnisliste.
     Sie bleiben auskommentiert, solange `comingSoon` auf true steht: die
     Seite trägt oben robots noindex, ein Live-Title dazu wäre widersprüchlich.
<title>Webdesign Triestingtal – Website mieten statt kaufen</title>
<meta name="description" content="Deine Website im Triestingtal: in rund zwei Wochen online, ab 200 € Einrichtung und 50 € im Monat. Domain, Hosting und Wartung inklusive. Aus Berndorf.">
<meta property="og:title" content="Webdesign Triestingtal – Website mieten statt kaufen">
<meta property="og:description" content="In zwei Wochen online, ab 200 € Einrichtung und 50 € im Monat. Domain, Hosting, Wartung und Änderungen inklusive.">
-->
<meta property="og:title" content="Bald online – auslage">
<meta property="og:description" content="auslage ist bald online.">
<meta property="og:image" content="/images/og-image.png">
<meta property="og:locale" content="de_AT">
<meta name="twitter:card" content="summary">

<!-- LocalBusiness-Schema. Telefon fehlt bewusst, solange keine Nummer feststeht —
     ein erfundener Wert wäre schlimmer als ein fehlendes Feld.
     E-Mail eintragen, sobald office@auslage.io aktiv ist. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "auslage",
  "description": "Website-as-a-Service für lokale Betriebe im Bezirk Baden und Triestingtal.",
  "founder": { "@type": "Person", "name": "Marina Zaiser" },
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Kruppstraße 24",
    "postalCode": "2560",
    "addressLocality": "Berndorf",
    "addressRegion": "Niederösterreich",
    "addressCountry": "AT"
  },
  "areaServed": [
    { "@type": "AdministrativeArea", "name": "Bezirk Baden" },
    { "@type": "AdministrativeArea", "name": "Triestingtal" }
  ],
  "priceRange": "€€",
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Website-Pakete",
    "itemListElement": [
      {
        "@type": "Offer",
        "name": "Starter",
        "price": "50",
        "priceCurrency": "EUR",
        "description": "50 € im Monat zzgl. 200 € einmalige Einrichtung."
      },
      {
        "@type": "Offer",
        "name": "Business",
        "price": "100",
        "priceCurrency": "EUR",
        "description": "100 € im Monat zzgl. 300 € einmalige Einrichtung."
      },
      {
        "@type": "Offer",
        "name": "Premium",
        "price": "150",
        "priceCurrency": "EUR",
        "description": "150 € im Monat zzgl. 500 € einmalige Einrichtung."
      }
    ]
  }
}
</script>

<!-- Tracking nach waas-seo-Standard: Plausible statt GA4 — cookiefrei, kein
     Einwilligungsbanner nötig. Einbinden, sobald Domain und Konto stehen,
     mit einem Conversion-Event auf das Absenden des Kontaktformulars.
     <script defer data-domain="auslage.io" src="https://plausible.io/js/script.js"></script> -->
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
