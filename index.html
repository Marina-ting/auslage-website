<!-- ─── Von Hand nichts mehr ändern: dieser Block wird beim Bauen ersetzt ───
     Alles zwischen den beiden Markern schreibt `scripts/prerender.mjs` beim
     `npm run build` für JEDE Seite neu — Titel, Beschreibung, Vorschau-Tags
     und die robots-Zeile. Die Werte kommen aus src/content/site.js
     (`routes`, `pageMeta`, `pricingPage`, `comingSoon`).

     Was hier steht, sieht man deshalb nur beim Entwickeln (`npm run dev`).
     Es ist bewusst der Coming-Soon-Wortlaut: sollte der Prerender-Schritt je
     ausfallen, ist ein zu zurückhaltender Titel der harmlosere Fehler.

     Beim Go-Live gibt es hier nichts mehr umzustellen. Es genügt, in
     site.js `comingSoon` auf false zu setzen — Titel, Beschreibungen und die
     robots-Zeile ziehen im nächsten Build von selbst nach. -->
<!-- PRERENDER:META -->
<meta name="robots" content="noindex,nofollow">
<title>Bald online – auslage</title>
<meta name="description" content="auslage ist bald online.">
<meta property="og:type" content="website">

<!-- LocalBusiness-Schema. Telefon und E-Mail stehen seit 19.08.2026 hier —
     die Business-Nummer ist endgültig (spusu, keine Rufnummernmitnahme).
     Achtung: dieser Block wird beim Bauen NICHT ersetzt, anders als der
     PRERENDER:META-Block darüber. Änderungen an Anschrift, Nummer oder
     Paketpreisen gehören von Hand auch hierher.

     Kein Bezirksname mehr in dieser Datei: bis 19.08.2026 stand einer in
     "description", bis 20.08.2026 in "areaServed". Marina hat den Nadelöhr-
     Eintrag dazu am 20.08.2026 mit Option B entschieden - auch dort raus,
     "areaServed" nennt nur noch das Triestingtal. Wer wieder einen Bezirk
     eintragen will, braucht eine neue Entscheidung von ihr. Kommentare gehen
     mit ins ausgelieferte HTML, deshalb hier kurz.

     20.08.2026 (Susi): Die Pakete trugen ein flaches "price": "50" - das sagt
     einer Maschine "kostet einmalig 50 EUR" und war damit schlicht falsch.
     Jetzt steht je Paket eine CompoundPriceSpecification: ein Monatspreis mit
     unitCode MON und die einmalige Einrichtung als zweiter Posten. Zahlen
     gegen site.js geprueft (Zeilen 285-322). Dazu neu: "@id", damit
     seitenspezifische Schemata auf diesen Betrieb verweisen koennen, und
     "image" fuer die Google-Business-Darstellung.

     21.08.2026 (Susi), drei Nachtraege:

     1) Nettopreise. Die Preisseite sagt seit 20.08.2026 ausdruecklich
     "zuzueglich gesetzlicher Umsatzsteuer"; im Schema stand nur der nackte
     Betrag, und eine Maschine liest einen Preis ohne Angabe als Endpreis.
     Jede UnitPriceSpecification traegt deshalb "valueAddedTaxIncluded": false.
     Wird je brutto ausgezeichnet, wird hier true daraus.

     2) Die Kaufpreise der Preisseite (1.000/2.000/3.000) stehen bewusst NICHT
     in diesem Katalog. Ein Einmalpreis neben drei Abo-Angeboten im selben
     hasOfferCatalog macht maschinell nicht unterscheidbar, was monatlich und
     was einmalig gilt. Unvollstaendig ist harmlos, zweideutig nicht. Wer sie
     auszeichnen will, braucht einen eigenen Offer-Zweig, keine vierte Zeile.

     3) Dieser Block bleibt hinter der Coming-Soon-Sperre stehen, anders als
     das FAQ-Schema, das im Prerendering abgeschaltet wird. FAQPage beschreibt
     Seiteninhalt und verlangt sichtbare Fragen; dieser Block beschreibt den
     Betrieb und wird seitenweit gesetzt. Dazu tragen alle Seiten waehrend
     Coming-Soon noindex,nofollow, und er ist die zweite Sicherung, falls das
     Prerendering ausfaellt. Mit comingSoon = false ist die Frage erledigt. -->
