<!-- ─── Von Hand nichts mehr ändern: dieser Block wird beim Bauen ersetzt ───
     Alles zwischen den beiden Markern schreibt `scripts/prerender.mjs` beim
     `npm run build` für JEDE Seite neu — Titel, Beschreibung, Vorschau-Tags
     und die robots-Zeile. Die Werte kommen aus src/content/site.js
     (`routes`, `pageMeta`, `pricingPage`, `comingSoon`).

     Was hier steht, sieht man deshalb nur beim Entwickeln (`npm run dev`).
     Es ist bewusst der Coming-Soon-Wortlaut: sollte der Prerender-Schritt je
     ausfallen, ist ein zu zurückhaltender Titel der harmlosere Fehler.

     Beim Go-Live gibt es hier nichts mehr umzustellen. Es genügt, in
     site.js `comingSoon` auf false zu setzen — Titel, Beschreibungen und die
     robots-Zeile ziehen im nächsten Build von selbst nach. -->
<!-- PRERENDER:META -->
<meta name="robots" content="noindex,nofollow">
<title>Bald online – auslage</title>
<meta name="description" content="auslage ist bald online.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="auslage">
<meta property="og:title" content="Bald online – auslage">
<meta property="og:description" content="auslage ist bald online.">
<meta property="og:image" content="/images/og-1200x630.png">
<meta property="og:locale" content="de_AT">
<meta name="twitter:card" content="summary_large_image">
<!-- /PRERENDER:META -->

<!-- LocalBusiness-Schema. Telefon und E-Mail stehen seit 19.08.2026 hier —
     die Business-Nummer ist endgültig (spusu, keine Rufnummernmitnahme).
     Achtung: dieser Block wird beim Bauen NICHT ersetzt, anders als der
     PRERENDER:META-Block darüber. Änderungen an Anschrift, Nummer oder
     Paketpreisen gehören von Hand auch hierher.

     Der Bezirk steht seit 19.08.2026 nur noch in "areaServed", nicht mehr in
     "description": eine Gebietsangabe sagt, wen auslage bedient, ein Fließ-
     textsatz wird zitiert wie ein Sichttext. Begründung und Beleg im Task
     "JSON-LD-Beschreibungssatz in index.html" (Susi). Kommentare gehen mit
     ins ausgelieferte HTML, deshalb hier kurz.

     20.08.2026 (Susi): Die Pakete trugen ein flaches "price": "50" - das sagt
     einer Maschine "kostet einmalig 50 EUR" und war damit schlicht falsch.
     Jetzt steht je Paket eine CompoundPriceSpecification: ein Monatspreis mit
     unitCode MON und die einmalige Einrichtung als zweiter Posten. Zahlen
     gegen site.js geprueft (Zeilen 285-322). Dazu neu: "@id", damit
     seitenspezifische Schemata auf diesen Betrieb verweisen koennen, und
     "image" fuer die Google-Business-Darstellung. -->
