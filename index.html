<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<meta name="theme-color" content="#2F5D50">

<!-- ─── Von Hand nichts mehr ändern: dieser Block wird beim Bauen ersetzt ───
     Alles zwischen den beiden Markern schreibt `scripts/prerender.mjs` beim
     `npm run build` für JEDE Seite neu — Titel, Beschreibung, Vorschau-Tags
     und die robots-Zeile. Die Werte kommen aus src/content/site.js
     (`routes`, `pageMeta`, `pricingPage`, `comingSoon`).

     Was hier steht, sieht man deshalb nur beim Entwickeln (`npm run dev`).
     Es ist bewusst der Coming-Soon-Wortlaut: sollte der Prerender-Schritt je
     ausfallen, ist ein zu zurückhaltender Titel der harmlosere Fehler.

     Beim Go-Live gibt es hier nichts mehr umzustellen. Es genügt, in
     site.js `comingSoon` auf false zu setzen — Titel, Beschreibungen und die
     robots-Zeile ziehen im nächsten Build von selbst nach. -->
<!-- PRERENDER:META -->
<meta name="robots" content="noindex,nofollow">
<title>Bald online – auslage</title>
<meta name="description" content="auslage ist bald online.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="auslage">
<meta property="og:title" content="Bald online – auslage">
<meta property="og:description" content="auslage ist bald online.">
<meta property="og:image" content="/images/og-image.png">
<meta property="og:locale" content="de_AT">
<meta name="twitter:card" content="summary">
<!-- /PRERENDER:META -->

<!-- LocalBusiness-Schema. Telefon fehlt bewusst, solange keine Nummer feststeht —
     ein erfundener Wert wäre schlimmer als ein fehlendes Feld.
     E-Mail eintragen, sobald office@auslage.io aktiv ist. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "auslage",
  "description": "Website-as-a-Service für lokale Betriebe im Bezirk Baden und Triestingtal.",
  "founder": { "@type": "Person", "name": "Marina Zaiser" },
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Kruppstraße 24",
    "postalCode": "2560",
    "addressLocality": "Berndorf",
    "addressRegion": "Niederösterreich",
    "addressCountry": "AT"
  },
  "areaServed": [
    { "@type": "AdministrativeArea", "name": "Bezirk Baden" },
    { "@type": "AdministrativeArea", "name": "Triestingtal" }
  ],
  "priceRange": "€€",
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Website-Pakete",
    "itemListElement": [
      {
        "@type": "Offer",
        "name": "Starter",
        "price": "50",
        "priceCurrency": "EUR",
        "description": "50 € im Monat zzgl. 200 € einmalige Einrichtung."
      },
      {
        "@type": "Offer",
        "name": "Business",
        "price": "100",
        "priceCurrency": "EUR",
        "description": "100 € im Monat zzgl. 300 € einmalige Einrichtung."
      },
      {
        "@type": "Offer",
        "name": "Premium",
        "price": "150",
        "priceCurrency": "EUR",
        "description": "150 € im Monat zzgl. 500 € einmalige Einrichtung."
      }
    ]
  }
}
</script>

<!-- Tracking nach waas-seo-Standard: Plausible statt GA4 — cookiefrei, kein
     Einwilligungsbanner nötig. Einbinden, sobald Domain und Konto stehen,
     mit einem Conversion-Event auf das Absenden des Kontaktformulars.
     <script defer data-domain="auslage.io" src="https://plausible.io/js/script.js"></script> -->
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
